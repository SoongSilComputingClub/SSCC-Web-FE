# ============================================================================
# Frontend Deploy Workflow (Coolify + GHCR)
# ============================================================================
name: Deploy Frontend to Coolify

on:
  workflow_run:
    workflows: ['Integrate Frontend']
    types:
      - completed
    branches:
      - develop
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sscc-web-fe

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      run_id: ${{ steps.get-run-info.outputs.run_id }}
      head_sha: ${{ steps.get-run-info.outputs.head_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get workflow run info
        id: get-run-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger detected. Finding latest successful integrate run..."
            RUN_INFO=$(gh run list \
              --workflow "Integrate Frontend" \
              --branch develop \
              --status success \
              --event push \
              --limit 1 \
              --json databaseId,headSha)
            RUN_ID=$(echo "$RUN_INFO" | jq -r '.[0].databaseId')
            HEAD_SHA=$(echo "$RUN_INFO" | jq -r '.[0].headSha')
            if [ "$RUN_ID" == "null" ] || [ -z "$RUN_ID" ]; then
              echo "::error::No successful integrate workflow run found"
              exit 1
            fi
            echo "Found run ID: $RUN_ID, commit: $HEAD_SHA"
          else
            echo "workflow_run trigger detected"
            RUN_ID="${{ github.event.workflow_run.id }}"
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT
      - name: Download artifact from Integrate workflow
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.get-run-info.outputs.run_id }}
      - name: Verify artifact
        run: |
          echo "Downloaded artifacts:"
          ls -la dist/
          if [ ! -f dist/index.html ]; then
            echo "::error::index.html not found in dist/"
            exit 1
          fi
      - name: Upload artifact for next jobs
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifact
          path: dist/
          retention-days: 1

  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    needs: [prepare]
    permissions:
      contents: read
      packages: write
      actions: read
    outputs:
      image_tag: ${{ needs.prepare.outputs.head_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-artifact
          path: dist
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.deploy
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.head_sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [prepare, build-image]
    steps:
      - name: Deploy to Coolify via webhook
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --request GET "${{ secrets.COOLIFY_WEBHOOK }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}")

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Coolify deployment failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Coolify deployment triggered successfully (HTTP $HTTP_STATUS)"
      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.head_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deploy Target**: Coolify Application" >> $GITHUB_STEP_SUMMARY